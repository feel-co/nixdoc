[package]
name = "nixdoc"
description = "Parser for Nixdoc documentation comments"
keywords = ["nix", "nixdoc", "documentation", "parser"]
categories = ["parsing", "text-processing"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true, features = ["alloc"], optional = true }
markdown = "1.0.0"

[dev-dependencies]
expect-test = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["std"]

# Enables std and unlocks the full standard library.
std = ["thiserror/std", "serde?/std"]

# Enables serde Serialize/Deserialize derives on all public types.
serde = ["dep:serde"]
